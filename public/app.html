<!doctype html>
<html lang="en">
<head>
<style id="gate">html{visibility:hidden}</style>
<script>fetch("/api/auth?a=me",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(m=>{window.SQ_USER=m;document.getElementById("gate").remove()}).catch(()=>location.replace("/"))</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SwastiQ – Health Records, Spoken</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--em:#1e4fa3;--em2:#163c7d;--teal:#0f7f95;--gold:#ffb23e;--bg:#f4f6fa;--card:#fff;--tx:#16202e;--mu:#566377;--ln:#dde3ec;--red:#b3261e;--redbg:#fdeceb;--amb:#9a6200;--ambbg:#fff3d9;--ok:#1b7a43;--okbg:#e3f5e9;--r:16px}
:root[data-theme=dark]{--bg:#0c1420;--card:#131d2c;--tx:#e6edf7;--mu:#93a4bb;--ln:#25344a;--redbg:#3a1a18;--ambbg:#3a2c0e;--okbg:#12301f;--em:#3d73e0;--em2:#2f5fc4;--teal:#3fb0c8;--red:#ff8a80}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;line-height:1.2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.app{display:flex;min-height:100%}
nav.side{display:none;width:240px;background:var(--card);border-right:1px solid var(--ln);padding:20px 12px;position:sticky;top:0;height:100vh;flex-direction:column;gap:4px}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:20}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);padding:6px 8px;min-width:56px;border-radius:12px;font-weight:500;text-decoration:none}
.nb svg,.sl svg{width:22px;height:22px}
.nb.on{color:var(--em);font-weight:700}
.mic-fab{background:var(--em);color:#fff!important;border-radius:50%;width:56px;height:56px;margin-top:-22px;justify-content:center;box-shadow:0 6px 16px rgba(30,79,163,.35)}
.sl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-weight:500;color:var(--mu);text-align:left;width:100%;text-decoration:none}
.sl.on{background:var(--em);color:#fff}
.sl:hover:not(.on){background:var(--bg)}
main{flex:1;min-width:0;padding:16px 16px 100px;max-width:1100px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-weight:700;font-size:22px;color:var(--em);text-decoration:none}
.logo svg{width:34px;height:34px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--okbg);color:var(--ok)}
.pill.off{background:var(--ambbg);color:var(--amb)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok)}
.chip.w{background:var(--ambbg);color:var(--amb)}.chip.d{background:var(--redbg);color:var(--red)}.chip.n{background:var(--bg);color:var(--mu);border:1px solid var(--ln)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
.stat b{font-family:Fraunces,serif;font-size:32px;display:block;color:var(--em)}.stat span{color:var(--mu);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;background:var(--em);color:#fff;font-weight:600;text-decoration:none;border:2px solid transparent}
.btn:hover{background:var(--em2)}.btn.alt{background:var(--card);color:var(--em);border:2px solid var(--em)}.btn.red{background:var(--red)}.btn.sm{min-height:40px;padding:0 14px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:linear-gradient(135deg,#ffb23e,#e69516);color:#3a2600;font-weight:700;box-shadow:0 6px 18px rgba(255,178,62,.3)}
input,select{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--card)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.list>*{padding:12px 0;border-bottom:1px solid var(--ln)}.list>*:last-child{border:0}
.mu{color:var(--mu);font-size:14px}
.alertbar{background:var(--redbg);border:2px solid var(--red);border-radius:var(--r);padding:16px;animation:pop .35s}
.alertbar h3{color:var(--red)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.hero{background:linear-gradient(160deg,#1e4fa3,#0f2f63);color:#fff;border-radius:24px;padding:28px 22px}
.hero h1{font-size:clamp(28px,6vw,48px);margin-bottom:12px}.hero p{max-width:560px;opacity:.92;margin-bottom:20px}
.hero .btn{background:#fff;color:var(--em)}.hero .btn.alt{background:transparent;color:#fff;border-color:#fff}
.bub{padding:10px 14px;border-radius:16px;max-width:88%;margin:6px 0}
.bub.u{background:var(--em);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.bub.a{background:var(--bg);border:1px solid var(--ln);border-bottom-left-radius:4px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0}
.micbtn{width:108px;height:108px;border-radius:50%;background:var(--em);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 8px 24px rgba(30,79,163,.3)}
.micbtn svg{width:46px;height:46px}
.micbtn.on{background:var(--red);box-shadow:0 8px 26px rgba(179,38,30,.4)}
.micbtn.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--red);animation:pulse 1.3s infinite}
@keyframes pulse{to{transform:scale(1.35);opacity:0}}
.rec-timer{font-family:Fraunces,monospace;font-size:20px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:8px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.wave{display:flex;gap:4px;align-items:center;height:42px}.wave i{width:5px;height:8px;border-radius:3px;background:var(--teal);transition:height .1s}
.wave.on i{animation:wv .7s infinite ease-in-out}
@keyframes wv{50%{height:38px}}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:15px}.kv dt{color:var(--mu)}.kv dd{font-weight:600;margin:0}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mu)}
.bars div span{width:100%;background:var(--teal);border-radius:6px 6px 0 0;min-height:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600}
.tw{overflow-x:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{padding:8px 16px;border-radius:99px;border:1.5px solid var(--ln);background:var(--card);font-weight:600;white-space:nowrap}.tabs .on{background:var(--em);color:#fff;border-color:var(--em)}
dialog{border:0;border-radius:20px;padding:22px;max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--tx)}dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90%;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.view{animation:fade .25s}@keyframes fade{from{opacity:0}}
.nb{position:relative}.btn,.nb,.sl,.ib,.micbtn,.tabs button{transition:transform .12s,background .15s,box-shadow .15s}.btn:active,.nb:active,.sl:active,.ib:active,.micbtn:active,.tabs button:active{transform:scale(.93)}.nb:hover{background:var(--bg)}
.ib{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--tx);background:var(--card);border:1px solid var(--ln);text-decoration:none}.ib:hover{background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.12)}.ib svg{width:22px;height:22px}
.bd{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:11px;font-style:normal;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.bar a.logo{text-decoration:none}
.door-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#1b4f9c,#12376f);color:#fff;border:1.5px solid var(--gold);box-shadow:0 4px 12px rgba(27,79,156,.25);cursor:pointer}
.door-pill svg{width:18px;height:18px;color:var(--gold)}
@media(min-width:900px){.bar .logo{display:none}.bar{justify-content:flex-end}nav.side{display:flex}nav.bot{display:none}main{padding:28px 32px}.g4{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}}
#live{position:fixed;top:calc(10px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 20px));z-index:60;display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:auto}
#live .alertbar{background:var(--card);box-shadow:0 12px 32px rgba(179,38,30,.35);animation:pop .35s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pulse{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:12px}.ring{position:relative;width:112px;height:112px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 28px Fraunces,serif}
.ecg{width:100%;max-width:260px;height:34px;color:var(--teal)}.ecg path{stroke-dasharray:260;stroke-dashoffset:260;animation:ecg 2.6s linear infinite}@keyframes ecg{to{stroke-dashoffset:-260}}
.wards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;flex:1;min-width:240px}.wt{border-radius:12px;padding:10px 12px;border-left:5px solid var(--ok);background:var(--okbg);display:flex;flex-direction:column}.wt.w{border-color:var(--amb);background:var(--ambbg)}.wt.d{border-color:var(--red);background:var(--redbg)}.wt small{color:var(--mu)}

/* ==================== CINEMATIC SINGLE-DOOR MODAL ==================== */
#doorOverlay{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(18,55,111,.92),rgba(8,16,32,.98));z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .4s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(8px)}
#doorOverlay.active{opacity:1;pointer-events:auto}
.door-container{max-width:920px;width:100%;display:flex;flex-direction:column;align-items:center;position:relative}
.door-close-btn{position:absolute;top:-46px;right:0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:20px;border:1px solid rgba(255,255,255,.2);transition:all .2s}
.door-close-btn:hover{background:rgba(255,255,255,.25);transform:scale(1.08)}
.door-header{text-align:center;color:#fff;margin-bottom:24px}
.door-header h2{font-size:clamp(24px,4vw,36px);color:#fff;margin-bottom:6px}
.door-header p{color:#d0e2ff;font-size:16px}
.door-stage{position:relative;width:min(340px,85vw);height:min(480px,65vh);perspective:1400px;display:flex;justify-content:center;margin:0 auto}
.door-frame{position:relative;width:100%;height:100%;background:#091931;border:8px solid #c9933b;border-radius:28px 28px 4px 4px;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 30px rgba(0,0,0,.8);overflow:hidden;transform-style:preserve-3d}
.door-arch{position:absolute;top:0;left:0;right:0;height:40px;background:linear-gradient(180deg,#c9933b,#8c6218);border-bottom:3px solid #63430c;display:flex;align-items:center;justify-content:center;color:#2c1b00;font-size:12px;font-weight:700;letter-spacing:2px}
.door-inside{position:absolute;inset:40px 0 0 0;background:radial-gradient(ellipse at 50% 40%,#ffffff,#e8f3ff 60%,#b9d8ff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .6s .2s;overflow-y:auto}
.door-inside.revealed{opacity:1}
.door-leaf{position:absolute;top:40px;left:0;right:0;bottom:0;background:linear-gradient(145deg,#1b4382,#0d254c);border-left:4px solid #c9933b;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.25,1,.3,1);box-shadow:inset -10px 0 30px rgba(0,0,0,.5);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.door-leaf.open{transform:rotateY(-112deg);box-shadow:-20px 10px 40px rgba(0,0,0,.7)}
.door-panels{width:80%;height:75%;border:2px solid rgba(201,147,59,.4);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;position:relative}
.door-panel-box{flex:1;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(0,0,0,.3));border:1.5px solid rgba(201,147,59,.3);border-radius:10px;display:flex;align-items:center;justify-content:center}
.door-crest{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#c9933b,#63430c);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.door-crest svg{width:32px;height:32px}
.door-handle{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:18px;height:64px;display:flex;flex-direction:column;align-items:center}
.handle-base{width:16px;height:48px;background:linear-gradient(90deg,#ffd572,#c9933b,#7d5512);border-radius:6px;box-shadow:2px 2px 8px rgba(0,0,0,.6)}
.handle-lever{width:34px;height:10px;background:linear-gradient(180deg,#fff1b0,#c9933b);border-radius:5px;position:absolute;top:10px;right:-14px;box-shadow:0 4px 8px rgba(0,0,0,.5);transform-origin:left center;transition:transform .3s}
.door-leaf:hover .handle-lever{transform:rotate(18deg)}
.door-instruction{color:#ffd572;font-size:14px;font-weight:600;margin-top:14px;text-align:center;letter-spacing:.5px;animation:doorGlow 1.8s infinite alternate}
@keyframes doorGlow{from{opacity:.7;transform:scale(.98)}to{opacity:1;transform:scale(1.02)}}
.light-rays{position:absolute;inset:0;background:radial-gradient(circle at 10% 50%,rgba(255,224,140,.85),transparent 75%);opacity:0;pointer-events:none;transition:opacity .7s}
.door-leaf.open ~ .light-rays{opacity:1}
.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px;margin-top:8px}
.lang-card{background:#fff;border:1.5px solid #c9d8ee;border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(18,55,111,.08)}
.lang-card:hover{transform:translateY(-3px);border-color:var(--em);box-shadow:0 8px 20px rgba(30,79,163,.2)}
.lang-card.active{background:var(--em);color:#fff;border-color:var(--em);box-shadow:0 6px 18px rgba(30,79,163,.3)}
.lang-card b{display:block;font-size:16px;font-family:Fraunces,Georgia,serif}
.lang-card span{display:block;font-size:11px;opacity:.8;margin-top:2px}
.lang-card small{display:block;font-size:10px;color:var(--teal);margin-top:2px;font-weight:600}
.lang-card.active small{color:#ffd572}
@media(max-width:400px){.lang-grid{grid-template-columns:repeat(2,1fr)}}

/* ==================== SWASTIQ SPATIAL GLASS UI UPGRADE ==================== */
:root{--glass:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.62);--glow:rgba(42,139,178,.16)}
body{background:radial-gradient(ellipse at 8% 5%,rgba(75,170,205,.13),transparent 34%),radial-gradient(ellipse at 92% 20%,rgba(79,132,210,.12),transparent 32%),var(--bg)}
.card{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(30,65,110,.055);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.card:hover{border-color:rgba(47,132,170,.28);box-shadow:0 14px 34px rgba(30,65,110,.10)}
.hero,.dash-hero{position:relative;overflow:hidden}
.dash-hero{padding:25px 24px;border-radius:24px;color:#fff;background:linear-gradient(120deg,rgba(18,68,137,.96),rgba(14,125,145,.90));box-shadow:0 18px 45px rgba(20,76,132,.20);margin-bottom:14px}
.dash-hero:before,.dash-hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.dash-hero:before{width:240px;height:240px;right:-55px;top:-125px;border:1px solid rgba(255,255,255,.24);box-shadow:0 0 0 22px rgba(255,255,255,.04),0 0 0 48px rgba(255,255,255,.035)}
.dash-hero:after{width:120px;height:120px;right:95px;bottom:-90px;background:rgba(255,255,255,.10);filter:blur(2px)}
.dash-hero h1{font-size:clamp(27px,4vw,39px);animation:swTextIn .65s both}
.dash-hero p{color:rgba(255,255,255,.84);margin-top:7px;animation:swTextIn .8s both}
.dash-hero .dash-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:13px;color:#eaf7ff}
.dash-live{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22)}
.dash-live:before{content:"";width:7px;height:7px;background:#78f0bd;border-radius:50%;box-shadow:0 0 12px #78f0bd}
@keyframes swTextIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat-tile{position:relative;overflow:hidden;text-align:left;min-height:118px;padding:16px;border:1px solid rgba(104,150,184,.22);border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(235,246,251,.68));color:var(--tx);box-shadow:0 9px 25px rgba(27,77,115,.07);cursor:pointer}
:root[data-theme=dark] .stat-tile{background:linear-gradient(145deg,rgba(34,54,77,.88),rgba(20,37,57,.82))}
.stat-tile:hover{transform:translateY(-4px) scale(1.012);box-shadow:0 16px 34px rgba(27,77,115,.14);border-color:rgba(31,135,160,.45)}
.stat-tile:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-24px;top:-28px;background:var(--glow)}
.stat-tile .stat-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:rgba(36,132,159,.12);color:var(--teal);font-size:18px;margin-bottom:8px}
.stat-tile b{display:block;font:700 30px Fraunces,serif;color:var(--em);line-height:1.1}
.stat-tile span{display:block;color:var(--mu);font-size:13px;margin-top:4px}
.stat-tile .stat-open{position:absolute;right:13px;bottom:12px;font-size:11px;color:var(--teal);font-weight:700}
.spatial-card{border:1px solid rgba(106,155,188,.24);background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(240,248,251,.58));backdrop-filter:blur(18px)}
:root[data-theme=dark] .spatial-card{background:linear-gradient(145deg,rgba(27,44,66,.9),rgba(16,31,49,.8))}
.wt{cursor:pointer;transition:transform .18s,box-shadow .18s}.wt:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.09)}
.click-record{cursor:pointer;border-radius:12px;padding:10px 8px;transition:background .15s,transform .15s}
.click-record:hover{background:var(--bg);transform:translateX(3px)}
.glass-modal{max-width:min(760px,calc(100% - 24px));max-height:86vh;overflow:auto;border:1px solid rgba(255,255,255,.45);background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(239,248,252,.94));box-shadow:0 28px 90px rgba(7,27,52,.32);backdrop-filter:blur(24px)}
:root[data-theme=dark] .glass-modal{background:linear-gradient(145deg,rgba(22,36,54,.98),rgba(12,24,40,.97));border-color:rgba(255,255,255,.12)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}

/* Language Detection helper for spoken/typed text */
function detectTextLang(t){
 if(!t)return'English';
 if(/[\u0B80-\u0BFF]/.test(t)||/\b(?:panninen|irukku|aachu|vandhaen|peyar|edai|adutha)\b/i.test(t))return'Tamil';
 if(/[\u0900-\u097F]/.test(t)||/\b(?:hai|tha|thi|hua|naam|wajan|umar|agli|ka|ki|ke|aaj)\b/i.test(t))return'Hindi';
 if(/[\u0C00-\u0C7F]/.test(t))return'Telugu';
 if(/[\u0C80-\u0CFF]/.test(t))return'Kannada';
 if(/[\u0D00-\u0D7F]/.test(t))return'Malayalam';
 if(/[\u0980-\u09FF]/.test(t))return'Bengali';
 if(/[\u0A80-\u0AFF]/.test(t))return'Gujarati';
 return'English';
}

// Prefer Gnani's detected language metadata; this also handles romanised speech.
function languageFromCode(code){
 const c=String(code||'').toLowerCase().replace('_','-');
 if(!c)return null;
 if(c==='ta'||c.startsWith('ta-'))return'Tamil';
 if(c==='hi'||c.startsWith('hi-'))return'Hindi';
 if(c==='te'||c.startsWith('te-'))return'Telugu';
 if(c==='kn'||c.startsWith('kn-'))return'Kannada';
 if(c==='ml'||c.startsWith('ml-'))return'Malayalam';
 if(c==='bn'||c.startsWith('bn-'))return'Bengali';
 if(c==='mr'||c.startsWith('mr-'))return'Marathi';
 if(c==='gu'||c.startsWith('gu-'))return'Gujarati';
 if(c==='en'||c.startsWith('en-'))return'English';
 const name=LANG_DEFS.find(x=>x.id.toLowerCase()===c);
 return name?name.id:null;
}

/* Conservative category-aware extraction: only explicitly labelled values are accepted. */
function extractCategoryFields(transcript, base){
 const text=normDigits(String(transcript||'')), ex=base||{}, details={...(ex.details||{})};
 const numberWords={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
 const nt='(\\d{1,3}|one|two|three|four|five|six|seven|eight|nine|ten|twelve)';
 const am=text.match(new RegExp('(?:age|aged|years? old|வயது|उम्र|వయస్సు|ವಯಸ್ಸು|പ്രായം)\\s*(?:is|of)?\\s*'+nt+'\\s*(years?|yrs?|months?|மாதம்|வருடம்)?','iu'));
 if(am){const n=numberWords[String(am[1]).toLowerCase()]??Number(am[1]);if(Number.isFinite(n))ex.age=String(n)+(/month|மாதம்/i.test(am[2]||'')?' mo':' y');}
 const wm=text.match(new RegExp('(?:weight|weighs|எடை|वजन|బరువు|ತೂಕ|ഭാരം)\\s*(?:is|of)?\\s*'+nt+'\\s*(?:kg|kilos?|kilograms?|கிலோ|किलो|కిలో|ಕಿಲೋ|കിലോ)?','iu'));
 if(wm){const n=numberWords[String(wm[1]).toLowerCase()]??Number(wm[1]);if(n>0&&n<=150)ex.w=n;}
 const bp=text.match(/(?:blood pressure|bp|இரத்த அழுத்தம்|रक्तचाप|రక్తపోటు|ರಕ್ತದೊತ್ತಡ)\s*(?:is)?\s*(\d{2,3}\s*\/\s*\d{2,3})/iu);if(bp)details.bp=bp[1].replace(/\s/g,'');
 const temp=text.match(/(?:temperature|வெப்பநிலை|तापमान|ఉష్ణోగ్రత|ತಾಪಮಾನ)\s*(?:is)?\s*(\d{2}(?:\.\d)?)\s*(?:°?c|celsius)?/iu);if(temp&&Number(temp[1])>=30&&Number(temp[1])<=45)details.temperature=temp[1]+' °C';
 const ht=text.match(/(?:height|length|உயரம்|लंबाई|ఎత్తు|ಎತ್ತರ|ഉയരം)\s*(?:is)?\s*(\d+(?:\.\d+)?)\s*(cm|centimet(?:er|re)s?|m)?/iu);if(ht)details.height=ht[1]+(ht[2]?' '+ht[2]:'');
 const dateSeg=(label)=>{const m=text.match(new RegExp('(?:'+label+')\\s*(?:is|on|due)?\\s*([^.;\\n]+)','iu'));if(!m)return null;return parseNext(m[0])?.iso||null};
 const vd=dateSeg('vaccination(?:\\s+due)?(?:\\s+date)?|vaccine due|தடுப்பூசி(?: தேதி)?|टीका(?: की तारीख)?');if(vd){details.vaccinationDue=vd;details.vaccDue=vd;}
 const dob=dateSeg('date of birth|born on|பிறந்த தேதி|जन्म तिथि');if(dob)details.dob=dob;
 const delivery=dateSeg('delivery date|delivered on|பிரசவ தேதி|प्रसव की तारीख');if(delivery)details.deliveryDate=delivery;
 const sm=text.match(/(?:symptoms?|complains? of|அறிகுறிகள்|लक्षण|లక్షణాలు|ಲಕ್ಷಣಗಳು|ലക്ഷണങ്ങൾ)\s*(?:are|is|of)?\s*([^.;\\n]+)/iu);if(sm)details.symptoms=sm[1].trim();
 const ob=text.match(/(?:observations?|notes?|clinical notes?|கவனிப்புகள்|टिप्पणी|పరిశీలనలు|ಅವಲೋಕನಗಳು|നിരീക്ഷണങ്ങൾ)\s*(?:are|is)?\s*([^.;\\n]+)/iu);if(ob)details.observations=ob[1].trim();
 ex.details=details;return ex;
}

function finish(){
 const scriptLang=detectTextLang(vs.tx);
 const detectedLang=lockedVoiceLanguage();
 const respLang=detectedLang||curLang()||'English';
 const copy=VOICE_COPY[respLang]||VOICE_COPY.English;
 const prior=vs.ex||{},sourceTx=vs.lastTx||vs.tx,parsed=extract(sourceTx),manual=vs.manualFields||{};
 const ex={...prior,...parsed};
 ['id','name','age','ward','w','next'].forEach(k=>{if(parsed[k]===undefined||parsed[k]===null||parsed[k]==='')ex[k]=prior[k]??null;if(Object.prototype.hasOwnProperty.call(manual,k))ex[k]=manual[k]});
 ex.details={...(prior.details||{}),...(parsed.details||{})};
 Object.keys(manual).forEach(k=>{if(!['id','name','age','ward','w','next','vacc','danger'].includes(k))ex.details[k]=manual[k]});
 ex.vacc=Object.prototype.hasOwnProperty.call(manual,'vacc')?manual.vacc:(parsed.vacc?.length?parsed.vacc:(prior.vacc||[]));
 ex.danger=parsed.danger?.length?parsed.danger:(prior.danger||[]);
 extractCategoryFields(sourceTx,ex);validate(ex);vs.ex=ex;ex.category=selectedCategory;ex.type=CATEGORY_TYPES[selectedCategory]||ex.type;
 // Keep the recognized spoken name, but display/store it in the selected language's script.
 if(ex.name)ex.sourceName=ex.name;
 let spoken='';
 if(ex.issues.length){
  vs.st='clarify';
  const issueText=localizeIssues(ex.issues,respLang);
  const msg=copy.clarify+': '+issueText+'.';
  say(msg);spoken=msg;
 }else{
  vs.st='confirm';
  const line=recordLine(ex,false,respLang);
  const msg=copy.heard+': '+line+'. '+copy.correct;
  say(msg);
  spoken=recordLine(ex,true,respLang)+'. '+copy.correct;
 }
 if(ex.danger.length)say(copy.danger);
 render();
 if(S.settings.readback)speakText(spoken,respLang);
}

const say=t=>{vs.log.push({r:'a',t})};

/* ==================== CONTINUOUS RECORDING (NO 30S LIMIT) ==================== */
let ws,ac,node,mst,recInterval,pcm=[],mode='main',recStartTime=0,recElapsedStr='00:00',recPaused=false,liveRec=null,recordLang='indic-auto';

function updateRecTimer(){
 if(vs.st!=='listening')return;
 const elapsed=Math.floor((Date.now()-recStartTime)/1000);
 const m=String(Math.floor(elapsed/60)).padStart(2,'0');
 const s=String(elapsed%60).padStart(2,'0');
 recElapsedStr=`${m}:${s}`;
 const el=$('#recTimerDisplay');
 if(el)el.textContent=recElapsedStr;
}

function pauseMic(){if(vs.st!=='listening'||recPaused)return;recPaused=true;try{ac?.suspend()}catch(e){};const b=$('#pauseRecBtn');if(b)b.textContent='Resume recording';}
function resumeMic(){if(vs.st!=='listening'||!recPaused)return;recPaused=false;try{ac?.resume()}catch(e){};const b=$('#pauseRecBtn');if(b)b.textContent='Pause recording';}
function teardown(){
 recPaused=false;clearInterval(recInterval);try{liveRec?.stop()}catch(e){}liveRec=null;
 try{mst&&mst.getTracks().forEach(t=>t.stop());node&&node.disconnect();ac&&ac.close()}catch(e){}
}

function wav(a){
 const n=a.length,b=new DataView(new ArrayBuffer(44+n*2)),w=(o,t)=>[...t].forEach((c,k)=>b.setUint8(o+k,c.charCodeAt(0)));
 w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,16000,true);b.setUint32(28,32000,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);
 for(let k=0;k<n;k++)b.setInt16(44+k*2,a[k],true);return b.buffer;
}

async function startMic(m){
 mode=m;recordLang=mode==='spell'?'en-IN':(lockedVoiceLanguage()?LC[lockedVoiceLanguage()]:'indic-auto');stopSpeak();
 try{mst=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}
 catch(e){toast(t('micBlocked','Microphone blocked. Allow microphone access in your browser settings.'));return}
 
 mst?.getAudioTracks().forEach(track=>track.addEventListener('ended',()=>{if(vs.st==='listening'){toast('Microphone connection ended. The captured audio will be transcribed.');stopMic();}}));
 pcm=[];recStartTime=Date.now();recElapsedStr='00:00';
 if(m=='main'){vs.log=vs.log||[];vs.detectedLang=null;vs.showCorr=false}
 vs.st='listening';render();

 ac=new AudioContext();const src=ac.createMediaStreamSource(mst);node=ac.createScriptProcessor(4096,1,1);const ratio=ac.sampleRate/16000;
 node.onaudioprocess=ev=>{
  const d=ev.inputBuffer.getChannelData(0);
  for(let i=0;i<d.length;i+=ratio){const v=Math.max(-1,Math.min(1,d[Math.floor(i)]));pcm.push(v<0?v*32768:v*32767)}
 };
 src.connect(node);node.connect(ac.destination);
 
 // Update live timer every second. Recording continues UNTIL MANUAL STOP! No 30s cutoff!
 recInterval=setInterval(updateRecTimer,500);
 try{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){liveRec=new SR();liveRec.continuous=true;liveRec.interimResults=true;liveRec.lang=lockedVoiceLanguage()?LC[lockedVoiceLanguage()]:'en-IN';
   liveRec.onresult=ev=>{let line='';for(let i=ev.resultIndex;i<ev.results.length;i++)line+=ev.results[i][0]?.transcript||'';const el=$('#liveTranscript');if(el&&line)el.textContent=line;};
   liveRec.onerror=()=>{};liveRec.start();
  }
 }catch(e){liveRec=null;}
}

async function stopMic(){
 if(vs.st!='listening')return;
 teardown();vs.st='transcribing';render();let tTxt='',detLang=null;
 
 try{
  if(pcm.length>8000){
   const reqLang=recordLang;
   const r=await fetch('/api/stt?lang='+encodeURIComponent(reqLang),{
    method:'POST',
    headers:{'Content-Type':'application/octet-stream'},
    body:wav(pcm)
   });
   const j=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(j.error||'Voice service error');
   tTxt=(j.transcript||'').trim();
   detLang=j.language||j.detected_language_code||j.language_code||null;
   vs.detectedLang=lockedVoiceLanguage()||languageFromCode(detLang)||null;
  }
 }catch(e){
  toast(e.message);say('Voice recognition service reported: '+e.message);
  vs.st='clarify';render();return;
 }

 if(mode=='corr'||mode=='spell'){
  if(!tTxt){say('I did not hear anything. Tap microphone to try again.');vs.st='clarify';render();return}
  return correct(tTxt,mode=='spell'?'name':vs.cf);
 }

 vs.lastTx=tTxt;vs.tx=[vs.tx,tTxt].filter(Boolean).join('\n');
 if(!tTxt){
  vs.st='clarify';
  say(curLang()==='Tamil'?'எதுவும் கேட்கவில்லை. மைக்ரோஃபோனைத் தட்டி மீண்டும் பேசவும்.':'I did not hear anything. Tap the microphone and try again.');
  render();return;
 }

 // Voice commands check (Confirm/Save)
 if(/^(ஆம்|சரி|சேமி|பதிவு செய்|உறுதி செய்|உறுதி|ஆம் சேமி|சரியாக உள்ளது|हाँ|सही है|सेव करो|सुरक्षित करो|पुष्टि|पुष्टि करें|yes|confirm|save|save record)$/iu.test(tTxt)){
  if(vs.ex&&!vs.ex.issues.length){commit();return}
 }

 vs.st='understanding';render();setTimeout(finish,400);
}

/* Field correction */
function correct(txt,force){
 const ex=vs.ex;if(!ex)return;txt=normDigits((txt||'').trim());if(!txt)return;
 const raw=txt,tNorm=txt.toLowerCase().replace(/[:=,]/g,' ').replace(/\s+/g,' ').trim();
 const num=(tNorm.match(/(\d+(?:\.\d+)?)/)||[])[1];
 
 if(/\b(weight|எடை|வજન|वजन)\b/iu.test(tNorm)||force==='w'){
  if(num){ex.w=parseFloat(num);say(curLang()==='Tamil'?`எடை ${ex.w} கிலோ என மாற்றப்பட்டது.`:`Weight updated to ${ex.w} kg.`);}
 }else if(/\b(name|பெயர்|नाम)\b/iu.test(tNorm)||force==='name'){
  const n=nameFrom(raw);if(n){ex.name=n;say(curLang()==='Tamil'?`பெயர் ${n} என மாற்றப்பட்டது.`:`Name updated to ${n}.`);}
 }else if(/\b(id|எண்|आईडी)\b/iu.test(tNorm)||force==='id'){
  if(num){ex.id=num;say(`ID set to ${num}`);}
 }
 validate(ex);vs.st=ex.issues.length?'clarify':'confirm';render();
}

function commit(){
 const ex=vs.ex;if(!ex){toast('Enter or record patient details first');return;}ex.vacc=Array.isArray(ex.vacc)?ex.vacc:[];ex.danger=Array.isArray(ex.danger)?ex.danger:[];ex.details=ex.details||{};validate(ex);if(ex.issues?.length){toast(ex.issues.join('. '));vs.st='clarify';render();return;}const isNew=ex.mode=='new',ts=new Date(TODAY+'T00:00').toLocaleDateString(curLang()=='Tamil'?'ta-IN':'en-IN',{day:'2-digit',month:'short'});
 if(isNew&&!ex.id)ex.id=nextId();
 if(isNew&&!String(ex.name||'').trim()){toast(VOICE_COPY[responseVoiceLanguage()]?.notHeard||'Patient name is required');return;}
 const id='V-'+(S.vseq++);
 if(isNew)S.ben.push({id:ex.id,name:ex.name,hh:`${String(ex.name||'Patient').split(' ')[0]} household · Ward ${ex.ward||'?'}`,age:ex.age||'—',vacc:ex.vacc.join(', ')||'None due',next:ex.next||TODAY,st:'Needs review',w:[],category:selectedCategory});
 const rec={id,b:ex.id,date:TODAY,type:ex.type,category:selectedCategory,w:ex.w,vacc:ex.vacc.join(', ')||'None',next:ex.next||TODAY,st:'Needs review',transcript:S.settings.save_tx?vs.tx:undefined,details:ex.details||{},aud:[ts+' · Created by voice']};
 
 S.visits.push(rec);
 const b=ben(rec.b);
 if(b){if(rec.w!=null)b.w.push(rec.w);if(ex&&ex.age)b.age=ex.age;if(ex&&ex.next)b.next=ex.next;if(ex&&ex.vacc&&ex.vacc.length)b.vacc=ex.vacc.join(', ')}
 if(rec.next&&rec.next!==TODAY&&!S.fu.some(f=>f.b==rec.b&&f.date==rec.next))S.fu.push({id:Date.now()+Math.random(),b:rec.b,date:rec.next,st:'Pending',category:selectedCategory,reason:'Next scheduled '+selectedCategory,visitId:rec.id});
 if(ex)ex.danger.forEach(d=>{const alert={id:Date.now()+Math.random(),v:rec.id,b:rec.b,rule:d.id,sign:d.sign,risk:'critical',ack:false,ref:false,referralStatus:'Pending Referral',ts:rec.aud[0].split(' · ')[0]};S.alerts.push(alert);notifyRisk(alert)});
 save();
 
 vs.st='saved';
 const saveLang=responseVoiceLanguage(),saveCopy=VOICE_COPY[saveLang]||VOICE_COPY.English;
 const sMsg=(saveCopy.saved||'Visit record saved successfully')+'. '+id;
 say(sMsg);toast(sMsg);render();
 if(S.settings.readback)speakText(sMsg,saveLang);
}

 const lab=sc>=75?'Stable':sc>=50?'Needs Attention':'Immediate Attention',W={};
 S.ben.forEach(b=>{const k=(b.hh.match(/Ward\s*(\d+)/)||[,'?'])[1],w=W[k]=W[k]||{n:0,o:0,a:0};w.n++;w.o+=S.fu.filter(f=>f.b===b.id&&f.st==='Pending'&&f.date<TODAY).length;w.a+=S.alerts.filter(x=>x.b===b.id&&!x.ack&&!x.resolved).length});

}

function alertCard(a){
 const lev=riskLevel(a),b=ben(a.b),crit=lev==='critical',name=b?.name||'Beneficiary '+a.b;
 const pill=`<span class="risk-pill risk-${lev}">${crit?mt('Urgent'):lev==='low'?mt('Reminder'):mt('Attention')}</span>`;
 if(!crit)return`<article class="al-card ${lev}"><div class="al-head"><h3>${esc(alertSignText(a.sign))}</h3>${pill}</div><dl class="al-facts"><div><dt>${mt('Patient')}</dt><dd>${esc(name)}</dd></div><div><dt>${mt('Beneficiary ID')}</dt><dd>${esc(a.b)}</dd></div><div><dt>${mt('Visit')}</dt><dd>${esc(a.v)}</dd></div><div><dt>${mt('Rule · Date')}</dt><dd>${esc(a.rule)} · ${esc(a.ts||'')}</dd></div></dl><div class="al-btns">${a.ack?`<span class="chip">${mt('Alert acknowledged')}</span>`:`<button class="btn alt sm" data-act="ack" data-id="${a.id}">${svg('check')} ${mt('Acknowledge alert')}</button>`}</div></article>`;
 const st=a.referralStatus||'Pending Referral',acked=st==='Referral Acknowledged'||st==='Patient Referred'||st==='Case Closed';
 const pend=st==='Referral Initiated'?mt('PHC acknowledgement pending'):st==='Pending Referral'?mt('Referral not yet initiated'):st==='Referral Acknowledged'?mt('PHC acknowledged'):st;
 const row=(act,label,icon,cls='')=>`<button class="al-row ${cls}" data-act="${act}" data-id="${a.id}">${svg(icon)}<span>${label}</span></button>`;
 return`<article class="al-card crit" role="group" aria-label="Critical patient alert for ${esc(name)}">
 <div class="al-head"><span class="al-ico">${svg('siren')}</span><h3>${mt('CRITICAL PATIENT ALERT')}</h3>${pill}</div>
 <div class="al-lines"><p><b>${mt('Patient')}:</b> ${esc(name)}</p><p><b>${mt('Beneficiary ID')}:</b> ${esc(a.b)}</p><p><b>${mt('Reported finding:')}</b> ${esc(alertSignText(a.sign))}</p><p><b>${mt('Location:')}</b> ${esc(a.location||'Household visit')}</p></div>
 <div class="al-action"><h4>${mt('Required action')}</h4><ol>${REQUIRED_ACTIONS.map(x=>`<li>${mt(x)}</li>`).join('')}</ol></div>
 <span class="al-status" role="status">${acked?'✓ ':''}${esc(pend)}</span>
 ${phcReply(a)}

function Alerts(){
 const A=S.alerts.slice().reverse(),act=A.filter(a=>!a.ack||(!a.resolved&&riskLevel(a)==='critical'));
 const open=A.filter(a=>riskLevel(a)==='critical'&&!a.resolved),awaiting=open.filter(a=>a.referralStatus==='Referral Initiated').length,unack=A.filter(a=>!a.ack&&!a.resolved).length,closed=A.filter(a=>a.resolved).length;
 act.sort((x,y)=>(riskLevel(y)==='critical')-(riskLevel(x)==='critical'));
 return`<div class="view"><div class="top"><h2>${t('alertTitle')}</h2><span class="row" style="gap:8px">${PH.role==='phc'?'<a class="btn sm" href="#phc">PHC dashboard</a>':''}<button class="btn alt sm" data-act="tsnd">Test alert sounds</button></span></div>
 <div class="al-sum" role="list"><div class="al-tile red" role="listitem"><b>${open.length}</b><span>${mt('Critical open')}</span></div><div class="al-tile amb" role="listitem"><b>${awaiting}</b><span>${mt('Awaiting PHC')}</span></div><div class="al-tile" role="listitem"><b>${unack}</b><span>${mt('To acknowledge')}</span></div><div class="al-tile ok" role="listitem"><b>${closed}</b><span>${mt('Cases closed')}</span></div></div>
 <div class="al-note">${svg('al')}<div>${mt('Risk alerts are decision-support prompts. Critical danger signs require urgent assessment under the applicable health protocol. An in-app alert does not mean the PHC has received a referral.')}</div></div>
 <div class="row al-legend"><span class="risk-pill risk-low">● ${mt('Reminder')}</span><span class="risk-pill risk-medium">● ${mt('Attention')}</span><span class="risk-pill risk-critical">● ${mt('Urgent')}</span></div>
 ${act.map(alertCard).join('')||`<div class="card al-empty"><b>${mt('All clear')}</b><span class="mu">${mt('No active alerts right now.')}</span></div>`}
 <h3 style="margin:18px 0 8px">${mt('Alert and referral history')}</h3><div class="card"><div class="list">${A.filter(a=>a.ack||a.resolved).map(a=>{const lev=riskLevel(a);return`<div class="al-hist"><div><b>${esc(alertSignText(a.sign))}</b> <span class="risk-pill risk-${lev}" style="padding:2px 8px">${lev==='critical'?mt('Urgent'):lev==='low'?mt('Reminder'):mt('Attention')}</span><div class="mu">Visit ${esc(a.v)} · Beneficiary ${esc(a.b)} · ${esc(a.ts||'')}</div><div class="mu">${esc(referralStatusText(a.referralStatus||'Pending Referral'))}${a.ackAt?' · seen '+esc(alTime(a.ackAt)):''}</div></div>${a.referralStatus==='Referral Initiated'?`<button class="btn alt sm" data-act="refconfirm" data-id="${a.id}">${mt('Record PHC acknowledgement')}</button>`:a.ref?`<span class="chip">${mt('Referral acknowledged')}</span>`:''}</div>`}).join('')||'<p class="mu">Alert history will appear here.</p>'}</div></div></div>`;
}

function Rep(){
 const V=S.visits,P=S.fu.filter(f=>f.st=='Pending').length,D=S.fu.filter(f=>f.st=='Completed').length,Rv=V.filter(v=>v.st=='Reviewed').length;
 return`<div class="view"><div class="top"><h2>${t('repTitle')}</h2></div><div class="grid g4">${stat(V.length,t('repTotalVisits'))}${stat(D,t('repFuCompleted'))}${stat(P,t('repFuPending'))}${stat(V.map(v=>v.b).filter((b,i,a)=>a.indexOf(b)===i).length,t('repBenVisited'))}${stat(V.filter(v=>/month|MR|Penta|Td/i.test(v.vacc)).length,t('repVaccFu'))}${stat(S.alerts.filter(a=>a.ref).length,t('repRefConfirmed'))}${stat(Rv,t('repRecReviewed'))}${stat(V.length-Rv,t('repRecToReview'))}</div></div>`;
}

function categoryValue(ex,key){

 if(key==='name')return (ex.mode==='new'?ex.name:(ex.id&&ben(ex.id)?ben(ex.id).name:ex.name))||'Not recorded';
 if(key==='w')return ex.w!=null?ex.w+' kg':'Not recorded';
 if(key==='vacc')return Array.isArray(ex.vacc)?(ex.vacc.join(', ')||'Not recorded'):(ex.vacc||'Not recorded');
 if(key==='danger')return ex.danger?.length?ex.danger.map(x=>x.sign).join('; '):(ex.details?.danger||'Not recorded');

let PH={role:'asha',list:[],ok:false,seen:null,me:''};

const phcWhen=ms=>{try{return new Date(ms).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
function sendReferral(x){
 const b=ben(x.b),v=S.visits.find(z=>z.id===x.v),d=(v&&v.details)||{};
 const meas=[d.bp&&'BP '+d.bp,v&&v.w!=null&&'Weight '+v.w+' kg',d.temp&&'Temp '+d.temp].filter(Boolean).join(' · ');
 return fetch('/api/referrals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',alertId:String(x.id),patientName:b&&b.name,beneficiaryId:x.b,finding:x.sign,measurements:meas,location:x.location||'Household visit',ashaPhone:S.settings.ashaPhone||''})})
  .then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(ok&&j.ok){x.sentToPhc=true;x.referralId=j.referral.id;save();toast('Referral sent to the PHC dashboard. PHC acknowledgement is pending.');render()}else toast(j.error||'Could not send the referral to the PHC')})
  .catch(()=>toast('Offline: referral saved here and will be sent when you are online.'));
}
async function syncReferrals(){
 try{
  const r=await fetch('/api/referrals',{cache:'no-store'});if(!r.ok)return;
  const d=await r.json(),before=JSON.stringify([PH.role,PH.list]);
  PH.role=d.role;PH.me=d.me;PH.list=d.list||[];PH.ok=true;
  if(d.role==='phc'){const ids=PH.list.filter(x=>x.status==='Pending').map(x=>x.id); // NB: the app's own Set() is the Settings view, so use arrays here
   if(PH.seen&&ids.some(i=>!PH.seen.includes(i))){playRiskSound('critical');toast('New urgent referral received')}PH.seen=ids}
  let changed=false;const mine=String(d.me).toLowerCase();
  S.alerts.forEach(a=>{
   const ref=PH.list.find(x=>x.alertId===String(a.id)&&String(x.ashaName).toLowerCase()===mine);
   if(!ref){ if(a.referralStatus==='Referral Initiated'&&!a.sentToPhc&&riskLevel(a)==='critical')sendReferral(a); return }
   if(ref.status==='Acknowledged'&&a.referralStatus==='Referral Initiated'){a.referralStatus='Referral Acknowledged';a.ref=true;a.phcAcknowledgedAt=new Date(ref.ackAt||Date.now()).toISOString();changed=true;toast('PHC acknowledged the referral for '+(ben(a.b)?.name||a.b))}
   if(JSON.stringify(a.phcInstructions||[])!==JSON.stringify(ref.instructions||[])){a.phcInstructions=ref.instructions||[];changed=true}
   if(JSON.stringify(a.phcFollowUp||null)!==JSON.stringify(ref.followUp||null)){a.phcFollowUp=ref.followUp||null;changed=true}
   if(ref.followUp&&!a.phcFuAdded){a.phcFuAdded=true;if(!S.fu.some(f=>f.refId===ref.id))S.fu.push({id:Date.now()+Math.random(),b:a.b,date:ref.followUp.date,st:'Pending',category:'PHC follow-up',reason:'PHC scheduled follow-up after referral',visitId:a.v,refId:ref.id});changed=true}
  });
  if(changed)save();
  if((changed||before!==JSON.stringify([PH.role,PH.list]))&&!$('#dlg')?.open)render();
 }catch(e){}
}
async function phcPost(body){

  if(!r.ok||!j.ok){toast(j.error||'Could not update the referral');return false}

/* ==================== RISK ALERTS + NOTIFICATION SOUNDS ==================== */
function riskLevel(a){return a?.risk||((/^R[1-4]$/.test(String(a?.rule||'')))?'critical':'medium')}
/* Every alert level beeps exactly THREE times; pitch/timbre tell the levels apart. */
let _sqCtx=null;
const BEEP_COUNT=3;
function playRiskSound(level='medium'){
 if(S.settings.sound===false)return;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  if(!_sqCtx||_sqCtx.state==='closed')_sqCtx=new Ctx();
  const ctx=_sqCtx;if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const vol=Math.max(0,Math.min(1,(Number(S.settings.vol??40)/100)));
  const P={critical:{hz:880,type:'square',gap:.32,len:.2,g:.10},medium:{hz:660,type:'triangle',gap:.36,len:.2,g:.16},low:{hz:520,type:'sine',gap:.40,len:.18,g:.14}}[level]||{hz:660,type:'triangle',gap:.36,len:.2,g:.16};
  const t0=ctx.currentTime+.03,peak=vol*P.g;
  for(let i=0;i<BEEP_COUNT;i++){
   const s0=t0+i*P.gap,o=ctx.createOscillator(),g=ctx.createGain();
   o.type=P.type;o.frequency.value=P.hz;
   g.gain.setValueAtTime(0,s0);g.gain.linearRampToValueAtTime(peak,s0+.015);g.gain.setValueAtTime(peak,s0+P.len-.04);g.gain.linearRampToValueAtTime(0,s0+P.len);
   o.connect(g);g.connect(ctx.destination);o.start(s0);o.stop(s0+P.len+.02);
  }
  if(level==='critical'&&navigator.vibrate)navigator.vibrate([200,120,200,120,200]);
 }catch(e){}
}

function showLiveAlert(a){
 const box=document.getElementById('live');if(!box)return;
 if([...box.children].some(n=>String(n.dataset.live)===String(a.id)))return;
 const b=ben(a.b),name=b?.name||'Beneficiary '+a.b,d=document.createElement('div');
 d.className='al-card crit';d.dataset.live=a.id;d.setAttribute('role','alertdialog');d.setAttribute('aria-label','Critical patient alert');
 d.innerHTML=`<div class="al-head"><span class="al-ico">${svg('siren')}</span><h3>CRITICAL PATIENT ALERT</h3><span class="risk-pill risk-critical">Urgent</span><button class="live-x" data-act="livex" data-id="${a.id}" aria-label="Dismiss">×</button></div>
 <div class="al-lines"><p><b>Patient:</b> ${esc(name)}</p><p><b>Beneficiary ID:</b> ${esc(a.b)}</p><p><b>Reported finding:</b> ${esc(a.sign)}</p><p><b>Location:</b> ${esc(a.location||'Household visit')}</p></div>
 <div class="al-action"><h4>Required action</h4><ol>${REQUIRED_ACTIONS.map(x=>`<li>${x}</li>`).join('')}</ol></div>
 <span class="al-status">PHC acknowledgement pending</span>
 <div class="al-rows">${phcBtn('al-row call')}<button class="al-row" data-act="liveopen" data-id="${a.id}">${svg('circk')}<span>Open alert &amp; mark referral</span></button><button class="al-row" data-act="liveack" data-id="${a.id}">${svg('circ')}<span>Acknowledge alert</span></button></div>`;
 box.prepend(d);
}
function notifyRisk(a){
 const level=riskLevel(a);playRiskSound(level);if(level==='critical')showLiveAlert(a);
 if(level==='critical'&&S.settings.notif&&'Notification'in window){
  const show=()=>{try{new Notification('CRITICAL HEALTH ALERT',{body:`${a.sign} · Beneficiary ${a.b}. Seek urgent assessment at the appropriate health facility according to protocol.`})}catch(e){}};
  if(Notification.permission==='granted')show();
  else if(Notification.permission==='default')Notification.requestPermission().then(p=>{if(p==='granted')show()}).catch(()=>{});
 }
}
function checkAlerts(){

 const add=(a)=>{const exists=S.alerts.some(x=>x.sourceFollowup&&String(x.sourceFollowup)===String(a.sourceFollowup)&&!x.resolved);if(!exists){S.alerts.push(a);notifyRisk(a)}};
