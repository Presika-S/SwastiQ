<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in – SwastiQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1b4f9c;--deep:#12376f;--mint:#2bb39b;--amber:#ffb23e;--ink:#17294a;--mu:#51647f;--sky:#eef4fb;--ln:#d9e4f2}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;font:17px/1.5 'Instrument Sans',system-ui,sans-serif;color:var(--ink);display:grid;grid-template-columns:1.1fr 1fr;background:#fff}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.015em;line-height:1.08}
.left{position:relative;background:var(--sky);overflow:hidden;display:flex;flex-direction:column;gap:26px;padding:32px clamp(24px,4vw,56px) 0;min-height:100svh}
.logo{display:flex;gap:9px;align-items:center;font:600 24px Fraunces,serif;color:var(--blue);text-decoration:none}.logo svg{width:34px;height:34px}
.left h1{font-size:clamp(32px,3.6vw,50px);max-width:14ch;position:relative;z-index:2}
.left p.s{color:var(--mu);margin-top:12px;max-width:36ch;position:relative;z-index:2}
.stage{position:relative;flex:1;min-height:470px;perspective:1200px;overflow:hidden;pointer-events:none;z-index:1}
.blob{position:absolute;border-radius:50%}.b1{width:520px;height:520px;background:var(--mint);opacity:.18;right:-140px;bottom:-200px}.b2{width:150px;height:150px;background:var(--amber);opacity:.5;left:6%;bottom:-40px}
.rig{position:absolute;left:50%;top:58px;width:270px;height:420px;margin-left:-135px;transform-origin:50% 0;transform-style:preserve-3d;will-change:transform}
.lan{position:absolute;left:50%;top:-500px;width:46px;height:540px;margin-left:-23px;background:linear-gradient(90deg,var(--blue),#2f6ac0);-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.sw{position:absolute;inset:0;transform-origin:50% -40px;animation:sw 5s ease-in-out infinite;transform-style:preserve-3d}
@keyframes sw{50%{transform:rotate(2.4deg)}0%,100%{transform:rotate(-2.4deg)}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,0,.2,1)}.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;box-shadow:0 36px 60px rgba(18,55,111,.28);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:0 22px 20px}
.edge{position:absolute;inset:0;border-radius:22px;background:var(--deep);transform:translateZ(-7px)}
.clip{width:58px;height:12px;border-radius:8px;background:var(--sky);margin:12px 0 10px;box-shadow:inset 0 2px 3px rgba(18,55,111,.3)}
.band{align-self:stretch;margin:0 -22px;background:var(--amber);color:#3a2600;font:600 14px 'Instrument Sans';text-align:center;padding:8px 0;letter-spacing:.04em}
.av{width:96px;height:96px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:600 36px Fraunces,serif;margin:22px 0 14px;border:5px solid var(--sky)}
.nm{font:600 25px/1.1 Fraunces,serif;text-align:center;min-height:2.2em;display:grid;place-items:center;word-break:break-word}.nm.ph{color:#9fb0c8}
.role{color:var(--mu);font-size:14px;text-align:center;margin-top:4px}
.idn{margin-top:14px;font:600 14px 'Instrument Sans';color:var(--blue);background:var(--sky);padding:5px 14px;border-radius:99px}
.bars{margin-top:auto;display:flex;gap:2px;height:34px;align-items:stretch}.bars i{background:var(--ink);width:3px}
.back{transform:rotateY(180deg);background:var(--mint);color:#fff;justify-content:center;text-align:center;gap:10px}
.back svg{width:84px;margin-bottom:6px}.back h2{font-size:30px}
.right{display:grid;place-items:center;padding:36px clamp(20px,5vw,72px)}
.card{width:100%;max-width:430px}
.card h2{font-size:clamp(32px,3.4vw,44px)}.card>p{color:var(--mu);margin:10px 0 26px}
label{display:block;font-weight:600;font-size:15px;margin:0 0 7px}
.f{margin-bottom:18px}.in{position:relative}
input{width:100%;height:54px;border:2px solid var(--ln);border-radius:14px;padding:0 16px;font:inherit;color:var(--ink);background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(27,79,156,.14)}
.eye{position:absolute;right:6px;top:6px;height:42px;padding:0 12px;border:0;background:none;color:var(--blue);font:600 14px 'Instrument Sans';cursor:pointer;border-radius:10px}
.go{width:100%;height:56px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 17px 'Instrument Sans';cursor:pointer;transition:transform .2s,box-shadow .2s}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(27,79,156,.3)}.go[disabled]{opacity:.7;cursor:wait;transform:none}
.err{min-height:24px;margin:-4px 0 10px;color:#d32f2f;font-size:15px;font-weight:600}
.or{display:flex;align-items:center;gap:14px;margin:26px 0 18px;color:var(--mu);font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{height:54px;border:2px solid var(--ln);border-radius:14px;background:#fff;color:var(--ink);font:600 15px 'Instrument Sans';display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,transform .2s}
.sb:hover{border-color:var(--blue);transform:translateY(-2px)}.sb.act{border-color:var(--mint);background:#effaf7}.sb svg{width:20px;height:20px;flex:none}
#gslot{grid-column:1/-1;display:flex;justify-content:center;overflow:hidden;border-radius:14px}
.note{margin-top:22px;font-size:14px;color:var(--mu);text-align:center}
body.leave{animation:out .7s .9s forwards}@keyframes out{to{opacity:0;transform:scale(1.03)}}
@media(max-width:860px){body{grid-template-columns:1fr}.left{min-height:0;gap:16px}.stage{flex:none;height:440px}.left h1{font-size:30px}.left p.s{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head>
<body>
<section class="left"><div class="blob b1"></div><div class="blob b2"></div><a class="logo" href="#"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="20" r="16" opacity=".35"/><path d="M8 20h4l3-8 5 16 4-12 2 4h6"/></svg>SwastiQ</a>
 <div style="position:relative;z-index:2"><h1>Every visit starts with you.</h1><p class="s">Sign in with your ASHA worker name to open today’s visits.</p></div>
 <div class="stage" aria-hidden="true">
  <div class="rig" id="rig"><div class="sw"><div class="lan"></div><div class="flip" id="flip"><div class="edge"></div>
   <div class="face"><div class="clip"></div><div class="band">ASHA WORKER</div><div class="av" id="av">?</div><div class="nm ph" id="nm">Your name</div><div class="role">Accredited Social Health Activist</div><div class="idn" id="idn">ID SQ-0000</div><div class="bars" id="bars"></div></div>
   <div class="face back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 9"/></svg><h2>Verified</h2><p id="wl">Welcome</p></div>
  </div></div></div></div>
</section>
<section class="right"><main class="card">
 <h2>Welcome back.</h2><p>Sign in to continue to SwastiQ.</p>
 <form id="f" novalidate>
  <div class="f"><label for="id" id="idl">Worker name</label><input id="id" autocomplete="username" placeholder="For example, Lakshmi R." required></div>
  <div class="f"><label for="pw">Password</label><div class="in"><input id="pw" type="password" autocomplete="current-password" placeholder="Your password" required><button class="eye" type="button" id="eye" aria-label="Show password">Show</button></div></div>
  <div class="err" id="err" role="alert" aria-live="polite"></div>
  <button class="go" id="go" type="submit">Sign in</button>
 </form>
</main></section>
<script>
const $=s=>document.querySelector(s);let cfg={},mode='name';
const idEl=$('#id'),nm=$('#nm'),av=$('#av'),idn=$('#idn'),err=$('#err'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
fetch('/api/auth?a=me',{cache:'no-store'}).then(r=>{if(r.ok)location.replace('landing.html')}).catch(()=>{});
const q=new URLSearchParams(location.search).get('err');if(q)err.textContent=q=='deny'?'This account is not on the approved list.':'Sign-in with X did not complete. Please try again.';
/* badge updates as the name is typed */
$('#bars').innerHTML=Array.from({length:30},(_,i)=>`<i style="width:${1+((i*7)%4)}px"></i>`).join('');
function badge(){const v=idEl.value.trim(),n=mode=='email'?v.split('@')[0]:v;nm.textContent=n||'Your name';nm.classList.toggle('ph',!n);
 av.textContent=n?n.split(/[\s.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''):'?';
 let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%9000;idn.textContent='ID SQ-'+String(n?1000+h:0).padStart(4,'0')}
idEl.addEventListener('input',badge);
/* 3D tilt */
let tx=0,ty=0,cx=0,cy=0;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
let k=1;const fit=()=>{const st=$('.stage');k=Math.min(1,(st.clientHeight-70)/420,st.clientWidth/300)};addEventListener('resize',fit);fit();
(function l(){cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;$('#rig').style.transform=`scale(${k}) `+(rm?'':`rotateY(${cx*26}deg) rotateX(${-cy*12}deg)`);requestAnimationFrame(l)})();
$('#eye').onclick=()=>{const p=$('#pw'),s=p.type=='password';p.type=s?'text':'password';$('#eye').textContent=s?'Hide':'Show'};
function done(name){$('#wl').textContent='Welcome, '+name;$('#flip').classList.add('on');document.body.classList.add('leave');setTimeout(()=>location.href='landing.html',rm?200:1900)}
$('#f').addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const id=idEl.value.trim(),password=$('#pw').value;
 if(!id||!password){err.textContent=mode=='email'?'Enter your email and password.':'Enter your name and password.';return}
 const b=$('#go');b.disabled=true;b.textContent='Signing in…';
 try{const r=await fetch('/api/auth?a=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password})}),j=await r.json().catch(()=>({}));
  if(!r.ok){err.textContent=j.error||'Sign-in failed. Please try again.';b.disabled=false;b.textContent='Sign in';return}
  b.textContent='Signed in';done(j.name)}catch(x){err.textContent='Cannot reach the server. Check your connection.';b.disabled=false;b.textContent='Sign in'}});
</script></body></html>
